name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD so `nx affected` compares against the last green main.
      - uses: nrwl/nx-set-shas@v5

      - run: npx nx format:check

      # Integration tests use Testcontainers; the Ubuntu runner provides Docker.
      - run: npx nx affected -t lint test build --parallel=3
