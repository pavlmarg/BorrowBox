# Local development infrastructure for BorrowBox.
#   cp infra/.env.example infra/.env   (then edit the values)
#   docker compose -f infra/docker-compose.yml up -d
# All ports are bound to 127.0.0.1 so nothing is exposed on the LAN.
name: borrowbox

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set in infra/.env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in infra/.env}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD:?set in infra/.env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set in infra/.env}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?set in infra/.env}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set in infra/.env}
      REVIEWS_DB_PASSWORD: ${REVIEWS_DB_PASSWORD:?set in infra/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/20-service-schemas.sh:/docker-entrypoint-initdb.d/20-service-schemas.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in infra/.env}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672' # AMQP
      - '127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672' # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8.10-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set in infra/.env}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (Cloudflare R2 in production), ADR-0009:
  # a private uploads bucket and a public-read bucket for processed photos.
  # Identities (admin / catalog / anonymous) come from infra/storage/seaweedfs.sh.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ADMIN_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:?set in infra/.env}
      S3_ADMIN_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:?set in infra/.env}
      S3_CATALOG_ACCESS_KEY_ID: ${S3_CATALOG_ACCESS_KEY_ID:?set in infra/.env}
      S3_CATALOG_SECRET_ACCESS_KEY: ${S3_CATALOG_SECRET_ACCESS_KEY:?set in infra/.env}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-borrowbox-uploads}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-borrowbox-public}
    entrypoint: ['/bin/sh', '/storage/seaweedfs.sh']
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333' # S3 API
    volumes:
      - seaweedfs-data:/data
      - ./storage/seaweedfs.sh:/storage/seaweedfs.sh:ro
    healthcheck:
      # The S3 API answering with any HTTP status means SeaweedFS is ready.
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://127.0.0.1:8333/']
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot: creates the buckets, upload CORS and the 1-day expiry on raw
  # uploads, then exits. Safe to re-run; the same script sets up R2 in production.
  storage-init:
    image: amazon/aws-cli:2.31.13
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY_ID:?set in infra/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_ACCESS_KEY:?set in infra/.env}
      AWS_DEFAULT_REGION: us-east-1
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-borrowbox-uploads}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-borrowbox-public}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:4200}
    entrypoint: ['/bin/sh', '/storage/init.sh']
    volumes:
      - ./storage/init.sh:/storage/init.sh:ro
    restart: 'no'

  # Catches all outgoing email in development. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # web UI

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  seaweedfs-data:
